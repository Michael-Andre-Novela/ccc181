services:
  db:
    image: postgres:17
    container_name: naiaexpresspass-db
    environment:
      POSTGRES_USER: naiaexpresspass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: naiaexpresspass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naiaexpresspass -d naiaexpresspass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: